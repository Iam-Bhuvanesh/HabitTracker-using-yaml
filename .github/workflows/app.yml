name: Habit Tracker
on:
  issues:
    types: [opened]
  schedule:
    - cron: '30 0 * * *' # Daily 6:00 AM IST Reset
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync_app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Process Logic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | xargs)
          LOWER_TITLE=$(echo "$CLEAN_TITLE" | tr '[:upper:]' '[:lower:]')
          TODAY=$(date +%Y-%m-%d)
          CURRENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # PATH A: AUTO-RESET/REFRESH
          if [ "$EVENT_NAME" = "schedule" ] || [ "$LOWER_TITLE" = "refresh" ]; then
            echo "Resetting habits..."
            jq 'map(.completed = false)' database.json > temp.json && mv temp.json database.json

          # PATH B: REMOVE TASK
          elif [[ "$LOWER_TITLE" == remove* ]]; then
            TARGET=$(echo "$CLEAN_TITLE" | sed -E 's/^[Rr][Ee][Mm][Oo][Vv][Ee][[:space:]]*//')
            echo "Removing task: $TARGET"
            jq --arg T "$TARGET" 'del(.[] | select(.task | ascii_downcase == ($T | ascii_downcase)))' database.json > temp.json && mv temp.json database.json

          # PATH C: MARK AS DONE
          elif [[ "$LOWER_TITLE" == done* ]]; then
            TARGET=$(echo "$CLEAN_TITLE" | sed -E 's/^[Dd][Oo][Nn][Ee][[:space:]]*//')
            YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
            echo "Completing task: $TARGET"
            jq --arg T "$TARGET" --arg DATE "$TODAY" --arg YESTERDAY "$YESTERDAY" --arg TIME "$CURRENT_TIME" '
              map(
                if .task | ascii_downcase == ($T | ascii_downcase) then
                  .completed = true |
                  .streak = (
                    if .lastCompletedDate == $DATE then .streak
                    elif .lastCompletedDate == $YESTERDAY then .streak + 1
                    else 1 end
                  ) |
                  .lastCompletedDate = $DATE |
                  .completedDates += (if .completedDates | contains([$DATE]) then [] else [$DATE] end) |
                  .totalCompleted = (if .completedDates | contains([$DATE]) then .totalCompleted else .totalCompleted + 1 end) |
                  .history += [{"date": $DATE, "time": $TIME, "action": "DONE"}]
                else . end
              )
            ' database.json > temp.json && mv temp.json database.json

          # PATH D: ADD NEW TASK
          elif [ "$EVENT_NAME" = "issues" ]; then
            echo "Adding task: $CLEAN_TITLE"
            jq --arg T "$CLEAN_TITLE" --arg DATE "$TODAY" '
              if any(.[]; .task | ascii_downcase == ($T | ascii_downcase)) then
                .
              else
                . + [{
                  "task": $T,
                  "completed": false,
                  "category": "Personal",
                  "priority": "Medium",
                  "frequency": "daily",
                  "completedDates": [],
                  "streak": 0,
                  "totalCompleted": 0,
                  "createdAt": $DATE,
                  "lastCompletedDate": null,
                  "history": []
                }]
              end
            ' database.json > temp.json && mv temp.json database.json
          fi

      - name: Rebuild README with Dashboard
        run: |
          TOTAL=$(jq 'length' database.json)
          COMPLETED=$(jq '[.[] | select(.completed == true)] | length' database.json)
          if [ "$TOTAL" -eq 0 ]; then
            RATE=0
          else
            RATE=$((COMPLETED * 100 / TOTAL))
          fi

          echo "# ☀️ Daily Dashboard & Habit Tracker" > README.md
          echo "**Last Update:** $(date)" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "" >> README.md
          echo "## 📊 Today's Quick Stats" >> README.md
          echo "" >> README.md
          echo "- **Completion Rate:** $COMPLETED/$TOTAL tasks ($RATE%)" >> README.md
          echo "- **Total Habits:** $TOTAL" >> README.md
          echo "- **Last Updated:** $(date)" >> README.md
          echo "" >> README.md
          echo "---" >> README.md
          echo "" >> README.md
          echo "## 🎯 Habits Checklist" >> README.md
          echo "" >> README.md

          jq -r '.[] | if .completed then "- [x] **\(.task)** | Streak: 🔥\(.streak)" else "- [ ] \(.task) | Streak: 🔥\(.streak) ➔ [[Tick It](https://github.com/${{ github.repository }}/issues/new?title=DONE%20\(.task|@uri))]" end' database.json >> README.md

          echo "" >> README.md
          echo "---" >> README.md
          echo "" >> README.md
          echo "## 🚀 How to Use" >> README.md
          echo "" >> README.md
          echo "### Add a New Task" >> README.md
          echo "[Click here to add a new task](https://github.com/${{ github.repository }}/issues/new) by using the task name as the issue title." >> README.md
          echo "" >> README.md
          echo "### Mark Task as Done" >> README.md
          echo "Click \"Tick It\" next to any habit, or open an issue with the title \`DONE TaskName\`." >> README.md
          echo "" >> README.md
          echo "### Remove a Task" >> README.md
          echo "Open an issue with the title \`REMOVE TaskName\`." >> README.md
          echo "" >> README.md
          echo "### Reset/Refresh Tasks" >> README.md
          echo "Open an issue with the title \`REFRESH\` to manually reset tasks." >> README.md

      - name: Save Changes
        run: |
          git config --global user.name "HabitBot"
          git config --global user.email "bot@github.com"
          git add database.json README.md
          git commit -m "Automated Dashboard Update - Simplified" || exit 0
          git push origin main

      - name: Close Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue close $ISSUE_NUM
