name: Habit Tracker Pro (Enhanced Edition)
on:
  issues:
    types: [opened]
  schedule:
    - cron: '30 0 * * *' # Daily 6:00 AM IST Reset
    - cron: '0 0 * * 0'  # Weekly Sunday Midnight Cleanup
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync_app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # NEW: Check if Template Issue
      - name: Check if Template Issue
        id: check_template
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            
            const isTemplate = body.includes('### Habit Name') || 
                               body.includes('category:') ||
                               body.includes('priority:') ||
                               body.includes('frequency:');
            
            core.setOutput('is_template', isTemplate ? 'true' : 'false');

      # NEW: Parse Template Fields
      - name: Parse Template Fields
        if: steps.check_template.outputs.is_template == 'true'
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            
            // Extract values using regex patterns
            const habitNameMatch = body.match(/#### Habit Name\n([^\n]+)/);
            const categoryMatch = body.match(/Category\*?\n([^\n]+)/);
            const priorityMatch = body.match(/Priority\*?\n([^\n]+)/);
            const frequencyMatch = body.match(/Frequency\*?\n([^\n]+)/);
            const descriptionMatch = body.match(/Description\n([^\n]+)/);
            const goalsMatch = body.match(/Goals\/Target\n([^\n]+)/);
            
            const habitName = habitNameMatch ? habitNameMatch[1].trim() : issue.title;
            const category = categoryMatch ? categoryMatch[1].trim() : 'Personal';
            const priority = priorityMatch ? priorityMatch[1].trim().replace(/[🔴🟠🟡🟢\s]/g, '') : 'Medium';
            const frequency = frequencyMatch ? frequencyMatch[1].trim() : 'Daily';
            const description = descriptionMatch ? descriptionMatch[1].trim() : '';
            const goals = goalsMatch ? goalsMatch[1].trim() : '';
            
            core.setOutput('habitName', habitName);
            core.setOutput('category', category);
            core.setOutput('priority', priority);
            core.setOutput('frequency', frequency);
            core.setOutput('description', description);
            core.setOutput('goals', goals);
            
            console.log('📋 Parsed Template:', { habitName, category, priority, frequency });

      # NEW: Apply Template Labels
      - name: Apply Template Labels
        if: steps.check_template.outputs.is_template == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const category = '${{ steps.parse.outputs.category }}';
            const priority = '${{ steps.parse.outputs.priority }}';
            const frequency = '${{ steps.parse.outputs.frequency }}';
            
            const labels = ['habit-tracker'];
            
            if (category && category !== 'Personal') {
              labels.push(`category/${category.toLowerCase()}`);
            }
            
            if (priority) {
              labels.push(`priority/${priority.toLowerCase()}`);
            }
            
            if (frequency) {
              labels.push(`frequency/${frequency.toLowerCase()}`);
            }
            
            console.log('🏷️  Applying labels:', labels);
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels
            });

      - name: Process Logic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_NAME: ${{ github.event_name }}
          IS_TEMPLATE: ${{ steps.check_template.outputs.is_template }}
          HABIT_NAME: ${{ steps.parse.outputs.habitName }}
          CATEGORY: ${{ steps.parse.outputs.category }}
          PRIORITY: ${{ steps.parse.outputs.priority }}
          FREQUENCY: ${{ steps.parse.outputs.frequency }}
          DESCRIPTION: ${{ steps.parse.outputs.description }}
          GOALS: ${{ steps.parse.outputs.goals }}
        run: |
          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | xargs)
          LOWER_TITLE=$(echo "$CLEAN_TITLE" | tr '[:upper:]' '[:lower:]')
          TODAY=$(date +%Y-%m-%d)
          CURRENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # PATH A: THE JANITOR (Sunday Cleanup)
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(date +%u)" = "7" ]; then
            echo "Cleaning up old issue logs..."
            gh issue list --state closed --label "habit-log" --limit 1000 --json number --jq '.[].number' | xargs -I {} gh issue delete {} --yes 2>/dev/null || true
          fi

          # PATH B: AUTO-RESET DAILY TASKS
          if [ "$EVENT_NAME" = "schedule" ] || [ "$LOWER_TITLE" = "refresh" ]; then
            echo "Auto-resetting daily/weekly/monthly habits..."
            jq 'map(.completed = false)' database.json > temp.json && mv temp.json database.json
          fi

          # PATH C: TEMPLATE ISSUE - Add with all metadata
          if [ "$IS_TEMPLATE" = "true" ]; then
            echo "Processing template issue..."
            EXISTING=$(jq --arg NAME "$HABIT_NAME" '.[] | select(.task | ascii_downcase == ($NAME | ascii_downcase))' database.json 2>/dev/null)
            
            if [ -z "$EXISTING" ]; then
              jq --arg T "$HABIT_NAME" \
                 --arg CAT "$CATEGORY" \
                 --arg PRI "$PRIORITY" \
                 --arg FREQ "$FREQUENCY" \
                 --arg DESC "$DESCRIPTION" \
                 --arg GOALS "$GOALS" \
                 --arg DATE "$TODAY" \
                 '. += [{
                   "task": $T,
                   "category": $CAT,
                   "priority": $PRI,
                   "frequency": $FREQ,
                   "description": $DESC,
                   "goals": $GOALS,
                   "completed": false,
                   "totalCompleted": 0,
                   "streak": 0,
                   "createdDate": $DATE,
                   "completedDates": [],
                   "history": []
                 }]' database.json > temp.json && mv temp.json database.json
              echo "✅ Habit added with template fields"
            fi

          # PATH D: REMOVE TASK
          elif [[ "$LOWER_TITLE" == remove* ]]; then
            TARGET=$(echo "$CLEAN_TITLE" | sed -E 's/^[Rr][Ee][Mm][Oo][Vv][Ee][[:space:]]*//')
            jq --arg T "$TARGET" 'del(.[] | select(.task | ascii_downcase == ($T | ascii_downcase)))' database.json > temp.json && mv temp.json database.json

          # PATH E: MARK AS DONE
          elif [[ "$LOWER_TITLE" == done* ]]; then
            TARGET=$(echo "$CLEAN_TITLE" | sed -E 's/^[Dd][Oo][Nn][Ee][[:space:]]*//')
            jq --arg T "$TARGET" --arg DATE "$TODAY" --arg TIME "$CURRENT_TIME" '
              map(
                if .task | ascii_downcase == ($T | ascii_downcase) then
                  .completed = true |
                  .lastCompletedDate = $DATE |
                  .completedDates += [$DATE] |
                  .totalCompleted += 1 |
                  .history += [{"date": $DATE, "time": $TIME, "action": "DONE"}] |
                  .streak = ((.completedDates | length) + 1)
                else . end
              )
            ' database.json > temp.json && mv temp.json database.json

          # PATH F: SET CATEGORY
          elif [[ "$LOWER_TITLE" == category* ]]; then
            TARGET=$(echo "$CLEAN_TITLE" | sed -E 's/^[Cc][Aa][Tt][Ee][Gg][Oo][Rr][Yy][[:space:]]+//' | cut -d'|' -f1 | xargs)
            CATEGORY=$(echo "$CLEAN_TITLE" | cut -d'|' -f2 | xargs)
            jq --arg T "$TARGET" --arg CAT "$CATEGORY" 'map(if .task | ascii_downcase == ($T | ascii_downcase) then .category = $CAT else . end)' database.json > temp.json && mv temp.json database.json

          # PATH G: SET PRIORITY
          elif [[ "$LOWER_TITLE" == priority* ]]; then
            TARGET=$(echo "$CLEAN_TITLE" | sed -E 's/^[Pp][Rr][Ii][Oo][Rr][Ii][Tt][Yy][[:space:]]+//' | cut -d'|' -f1 | xargs)
            PRIORITY=$(echo "$CLEAN_TITLE" | cut -d'|' -f2 | xargs)
            jq --arg T "$TARGET" --arg PRI "$PRIORITY" 'map(if .task | ascii_downcase == ($T | ascii_downcase) then .priority = $PRI else . end)' database.json > temp.json && mv temp.json database.json

          # PATH H: SET FREQUENCY
          elif [[ "$LOWER_TITLE" == frequency* ]]; then
            TARGET=$(echo "$CLEAN_TITLE" | sed -E 's/^[Ff][Rr][Ee][Qq][Uu][Ee][Nn][Cc][Yy][[:space:]]+//' | cut -d'|' -f1 | xargs)
            FREQ=$(echo "$CLEAN_TITLE" | cut -d'|' -f2 | xargs)
            jq --arg T "$TARGET" --arg FREQ "$FREQ" 'map(if .task | ascii_downcase == ($T | ascii_downcase) then .frequency = $FREQ else . end)' database.json > temp.json && mv temp.json database.json

          # PATH I: ADD NEW TASK (Non-template)
          elif [ "$EVENT_NAME" = "issues" ] && [ "$IS_TEMPLATE" != "true" ]; then
            jq --arg T "$CLEAN_TITLE" --arg DATE "$TODAY" 'if any(.[]; .task == $T) then . else . + [{"task": $T, "completed": false, "category": "Personal", "priority": "Medium", "frequency": "daily", "totalCompleted": 0, "streak": 0, "createdDate": $DATE, "completedDates": [], "history": []}] end' database.json > temp.json && mv temp.json database.json
          fi

      - name: Calculate Analytics
        run: |
          jq '{
            "totalTasks": length,
            "completedToday": [.[] | select(.completed == true)] | length,
            "completionRate": (([.[] | select(.completed == true)] | length) / length * 100 | round),
            "topHabits": (sort_by(-.totalCompleted) | .[0:3] | map({task: .task, completions: .totalCompleted, streak: .streak})),
            "needsAttention": (sort_by(.totalCompleted) | .[0:3] | map({task: .task, completions: .totalCompleted})),
            "categories": (group_by(.category) | map({category: .[0].category, total: length, completed: ([.[] | select(.completed == true)] | length)}))
          }' database.json > analytics.json

      - name: Rebuild README with Dashboard
        run: |
          cat > README.md << 'EOF'
          # ☀️ Daily Dashboard & Habit Tracker Pro
          **Last Update:** $(date)

          ---

          ## 📊 Today's Quick Stats
          EOF

          TOTAL=$(jq 'length' database.json)
          COMPLETED=$(jq '[.[] | select(.completed == true)] | length' database.json)
          RATE=$((COMPLETED * 100 / TOTAL))

          cat >> README.md << EOF

          - **Completion Rate:** $COMPLETED/$TOTAL tasks (${RATE}%)
          - **Total Habits:** $TOTAL
          - **Last Updated:** $(date)

          ---

          ## 🎯 Tasks by Category

          EOF

          for category in $(jq -r '.[].category' database.json | sort -u); do
            echo "### 📌 $category" >> README.md
            jq -r --arg CAT "$category" '.[] | select(.category == $CAT) | if .completed then "- [x] **\(.task)** | Priority: \(.priority) | Streak: 🔥\(.streak)" else "- [ ] \(.task) | Priority: \(.priority) | Streak: 🔥\(.streak)" end' database.json >> README.md
            echo "" >> README.md
          done

          cat >> README.md << 'EOF'

          ---

          ## 📈 Analytics & Insights

          ### 🏆 Top Performers
          EOF

          jq -r '.[] | select(.totalCompleted > 0) | "- **\(.task):** \(.totalCompleted) completions | Streak: 🔥\(.streak)"' database.json | head -3 >> README.md || echo "- Start completing tasks! 🎉" >> README.md

          cat >> README.md << 'EOF'

          ### ⚠️ Needs Attention
          EOF

          jq -r '.[] | select(.totalCompleted == 0) | "- **\(.task):** Priority: \(.priority)"' database.json | head -3 >> README.md || echo "- All habits have been started! 🎉" >> README.md

          cat >> README.md << 'EOF'

          ---

          ## 🚀 How to Use

          ### Add a New Task Using Template
          [Click here to add a new task using the template](https://github.com/${{ github.repository }}/issues/new?template=habit-tracker.yml)

          ### Mark Task as Done
          Click "Tick It" or create issue: `DONE TaskName`

          ### Remove a Task
          Create issue: `REMOVE TaskName`

          ### Set Category
          Create issue: `CATEGORY TaskName | Learning`

          ### Set Priority
          Create issue: `PRIORITY TaskName | High`

          ### Set Frequency
          Create issue: `FREQUENCY TaskName | daily`

          ---

          ## ✨ Features

          ✅ Analytics & Stats | ✅ Categories & Priorities | ✅ Recurring Habits | ✅ Complete History | ✅ Visual Dashboard | ✅ Template-based Issue Creation

          **Built with ❤️ using GitHub Actions & YAML**
          EOF

      # NEW: Post Template Confirmation
      - name: Post Template Confirmation
        if: steps.check_template.outputs.is_template == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const habitName = '${{ steps.parse.outputs.habitName }}';
            const category = '${{ steps.parse.outputs.category }}';
            const priority = '${{ steps.parse.outputs.priority }}';
            const frequency = '${{ steps.parse.outputs.frequency }}';
            
            const comment = `
✅ **Habit Successfully Tracked!**

📋 **Habit Details:**
| Field | Value |
|-------|-------|
| **Name** | ${habitName} |
| **Category** | ${category} |
| **Priority** | ${priority} |
| **Frequency** | ${frequency} |

Your habit has been added to the tracker with all metadata!
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Force Save
        run: |
          git config --global user.name "HabitBot"
          git config --global user.email "bot@github.com"
          git add database.json analytics.json README.md
          git commit -m "Automated Dashboard Update - Template Processing Enabled" || exit 0
          git push origin main

      - name: Label and Close Issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh label create "habit-log" --color "FBCA04" --description "Habit Tracker Logs" || true
          gh issue edit $ISSUE_NUM --add-label "habit-log"
          gh issue close $ISSUE_NUM
